name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: runs from forks get no secrets and no write permissions.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build and run tests
        shell: pwsh
        run: ./scripts/Build.ps1
